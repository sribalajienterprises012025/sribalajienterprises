name: Deploy

# Push to main and the database follows the code. Cloudflare Pages rebuilds the
# site on its own through the Git integration, so this workflow owns the parts
# Cloudflare cannot: applying migrations, deploying the edge function, and then
# checking that what went live is actually correct.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_verify:
        description: 'Skip the post-deploy checks (use only if Cloudflare is slow)'
        type: boolean
        default: false

concurrency:
  # Never let two migration runs overlap, and never cancel one part-way: a
  # half-applied migration is worse than a queued one.
  group: deploy-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: jaeynmolmvxtzllyqbyh
  SITE_URL: https://sribalajienterprises.pages.dev

jobs:
  # Nothing reaches the production database until all 159 assertions pass
  # against a throwaway copy of the same schema. This is the gate that makes
  # automatic migrations safe rather than reckless.
  gate:
    name: Prove the migrations are safe
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install the Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply every migration and run the assertions
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-db.sh

  # The job this pipeline was missing.
  #
  # It previously assumed Cloudflare's Git integration would build and publish
  # the site on its own. When that integration is disconnected — which is
  # exactly what happened here — a push migrated the database, the verify job
  # checked a site nobody had deployed, and the site stayed blank with nothing
  # in the pipeline able to fix it. Publishing from here removes the dashboard
  # from the path entirely: the build that is checked is the build that is
  # uploaded.
  #
  # Needs only `gate`, not `database`, so a missing database credential cannot
  # also keep the site from going up.
  site:
    name: Publish the site to Cloudflare Pages
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployed: ${{ steps.check.outputs.deploy }}
    env:
      # The account id is an identifier, not a credential: it says which account
      # to publish into and grants nothing on its own — a token is still
      # required, and Cloudflare's own examples commit this value. Keeping it
      # here means only one thing has to be kept secret. A repository secret or
      # variable of the same name still wins, so a different account can be
      # used without editing this file.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'cd506e18cce7c9bb2ae59c4a68b2bd2d' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A secret cannot be read inside an `if:`, so the decision is made here.
      - name: Check for a Cloudflare credential
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CF_TOKEN" ]; then
            echo "publishing to account $CLOUDFLARE_ACCOUNT_ID"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The site was not published from CI: CLOUDFLARE_API_TOKEN is not set. It is the only secret this job needs."
            echo "::warning::Add it under Settings -> Secrets and variables -> Actions. Create it at dash.cloudflare.com/profile/api-tokens -> Create Token -> Create Custom Token, with permission Account / Cloudflare Pages / Edit."
            echo "::warning::Until then the site only updates if the Pages project's Git integration is connected."
          fi

      - run: npm ci
        if: steps.check.outputs.deploy == 'true'

      - run: npm run build
        if: steps.check.outputs.deploy == 'true'

      # The same assertion CI makes, repeated here because this is the build
      # that actually goes live.
      - name: The build must be a build
        if: steps.check.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          grep -qE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html \
            || { echo "::error::dist/index.html references no hashed bundle; refusing to publish it"; exit 1; }
          test -f dist/_redirects
          test -f dist/_headers

      # Reads `pages_build_output_dir` from wrangler.toml, so the directory
      # cannot drift between this and the dashboard.
      - name: Deploy
        if: steps.check.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy --project-name=sribalajienterprises --branch=main

      # `pages deploy` fails plainly when the project name is wrong, which is
      # the one thing here that cannot be checked without the token. Listing the
      # account's projects turns that into an answer rather than a guess.
      - name: Name the projects on this account if the deploy failed
        if: failure() && steps.check.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::The deploy failed. The Pages projects on this account are listed below;"
          echo "::notice::if none is called 'sribalajienterprises', change --project-name in this workflow to the one that is."
          npx --yes wrangler@3 pages project list || true

  database:
    name: Apply migrations to production
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A secret cannot be read inside an `if:` condition, so which path to take
      # is decided here and published as a step output instead.
      - name: Choose how to connect
        id: creds
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$DB_URL" ]; then
            echo "using SUPABASE_DB_URL (grants this one database)"
            echo "mode=db_url" >> "$GITHUB_OUTPUT"
          elif [ -n "$ACCESS_TOKEN" ] && [ -n "$DB_PASSWORD" ]; then
            echo "using SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD"
            echo "mode=linked" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No database credential is configured."
            echo "::error::Add SUPABASE_DB_URL (preferred — it grants only this database), or both SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
            echo "::error::Settings -> Secrets and variables -> Actions. See README, 'Automatic deployment'."
            exit 1
          fi

      # Preferred path. A connection string grants exactly one database, where
      # an account access token grants every project on the account. Use the
      # SESSION POOLER string from the dashboard: GitHub runners have no IPv6,
      # and a new project's direct database host is IPv6-only.
      - name: Push migrations (connection string)
        if: steps.creds.outputs.mode == 'db_url'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DB_URL" --include-all

      - name: Push migrations (linked project)
        if: steps.creds.outputs.mode == 'linked'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked || true
          supabase db push --include-all

  # Separate job, because deploying a function is the only part that needs an
  # account-wide access token. Without one the migrations above still run and
  # the app still works — only "Create a login" stays unavailable, and its own
  # screen says so.
  functions:
    name: Deploy the create-staff function
    needs: database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no access token is configured
        id: check
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, so the create-staff function was not deployed. Staff invitations work regardless; add the token if you also want to create logins directly."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.deploy == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.check.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-staff --project-ref "$SUPABASE_PROJECT_REF"

  verify:
    name: Check what actually went live
    needs: [site, database, functions]
    # Runs as long as the site went up. A missing database credential fails the
    # `database` job, and without this the run would stop there and never say
    # whether the site itself is actually live — which is the thing being asked.
    if: ${{ !cancelled() && !inputs.skip_verify && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Needed by the schema check below, which falls back to the publishable
      # key committed in .env.production.
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare to publish the new build
        run: |
          set -euo pipefail
          # Cloudflare builds in parallel with this workflow, so give it room.
          for attempt in $(seq 1 30); do
            html=$(curl -fsS "$SITE_URL" --max-time 20 || true)
            if printf '%s' "$html" | grep -qE '/assets/index-[A-Za-z0-9_-]+\.js'; then
              echo "built bundle is live (attempt $attempt)"
              exit 0
            fi
            if printf '%s' "$html" | grep -q '/src/main.tsx'; then
              echo "attempt $attempt: still serving the unbuilt entry point"
            else
              echo "attempt $attempt: no bundle reference yet"
            fi
            sleep 20
          done
          echo "::error::After 10 minutes the site is still not serving a built bundle."
          echo "::error::Nothing published it. Either add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID so the 'Publish the site' job can deploy (see its warnings above),"
          echo "::error::or reconnect the Pages project to this repository in the Cloudflare dashboard with build command 'npm run build' and output directory 'dist'."
          exit 1

      - name: The site must be configured, and must not carry a secret key
        run: |
          set -euo pipefail
          html=$(curl -fsS "$SITE_URL" --max-time 20)
          chunk=$(printf '%s' "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          bundle=$(curl -fsS "$SITE_URL$chunk" --max-time 40)

          printf '%s' "$bundle" | grep -q "$SUPABASE_PROJECT_REF" \
            || { echo "::error::the live bundle has no Supabase URL — it will show the setup screen"; exit 1; }
          printf '%s' "$bundle" | grep -qE 'sb_publishable_|eyJhbGciOi' \
            || { echo "::error::the live bundle has no browser key"; exit 1; }
          # The prefix alone is in every bundle by design — the app checks for
          # it to refuse starting with one — so this must match a whole key.
          if printf '%s' "$bundle" | grep -qE 'sb_secret_[A-Za-z0-9_-]{20,}'; then
            echo "::error::a Supabase SECRET key is live in the browser bundle. Roll it now."
            exit 1
          fi
          echo "live bundle is configured, and carries no secret key"

      - name: Deep links must resolve
        run: |
          set -euo pipefail
          for path in / /trips /invoices /reports; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$path" --max-time 20)
            echo "  $path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code; the _redirects rule is not applying"; exit 1; }
          done

      - name: The schema must be present
        env:
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # Falls back to the committed build default when the variable is unset,
          # since the publishable key is not a secret either way.
          key="${KEY:-$(grep -oP 'VITE_SUPABASE_PUBLISHABLE_KEY=\K.*' .env.production 2>/dev/null || true)}"
          if [ -z "$key" ]; then
            echo "::notice::no publishable key available to this job; skipping the schema check"
            exit 0
          fi
          # No -f here on purpose: the interesting answer is a 404 body that
          # names PGRST205, and -f would discard it and leave this check
          # passing on an empty string.
          response=$(curl -sS -w '\n%{http_code}' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/vehicles?select=id&limit=1" \
            -H "apikey: $key" --max-time 25)
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "  HTTP $status"

          if printf '%s' "$body" | grep -q 'PGRST205'; then
            echo "::error::the vehicles table is missing — migrations did not reach this project"
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::unexpected reply from the REST API (HTTP $status): $body"
            exit 1
          fi
          echo "schema is present"
