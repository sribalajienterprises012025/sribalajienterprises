name: CI

# Every push and every pull request. The database assertions are the point:
# they catch the class of mistake that only shows up in Postgres — a policy that
# leaks across businesses, a ledger that double-counts, a constraint that
# rejects what the app sends.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run on the same ref pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`, so a lockfile that has drifted from
      # package.json fails here instead of resolving differently in production.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The failure that put a blank page in production: Cloudflare serving the
      # repo root. Assert the build really produced a bundled entry point.
      - name: Check the build output is actually built
        run: |
          set -euo pipefail
          test -f dist/index.html
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "::error::dist/index.html still points at /src/main.tsx — the build did not transform the entry point."
            exit 1
          fi
          grep -qE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html \
            || { echo "::error::no hashed entry bundle referenced in dist/index.html"; exit 1; }
          test -f dist/_redirects
          test -f dist/_headers
          echo "dist looks correct:"
          ls -1 dist

      # Matches a key, not the prefix. The bare prefix appears in the bundle by
      # design — `src/lib/supabase.ts` checks `startsWith('sb_secret_')` and
      # supabase-js carries the same literal — so grepping for it failed on
      # every build the moment it was added, and would have gone on failing
      # whether or not a key was ever present. A real key is the prefix
      # followed by a long run of key characters; the guard now needs that.
      - name: Refuse a secret key in the bundle
        run: |
          set -euo pipefail
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{20,}" dist/ 2>/dev/null; then
            echo "::error::a Supabase secret key is present in the build output. Roll it immediately."
            grep -rlE "sb_secret_[A-Za-z0-9_-]{20,}" dist/ || true
            exit 1
          fi
          echo "no secret key in the build output"

      # The bug this guards against made every form in the app unsubmittable:
      # `zodResolver` hands `handleSubmit` the schema's *output*, so a second
      # `schema.parse(values)` in a submit handler feeds transformed values back
      # through the input schema and throws `Expected string, received null`.
      # The resolver's own types claim otherwise, so a typecheck cannot catch
      # it. Use `zodForm` from src/lib/form.ts and take the values as they come.
      - name: Forms must not re-parse what the resolver already parsed
        run: |
          set -euo pipefail
          if grep -rnE --include='*.tsx' '(Schema|schema)\.parse\((values|data)\)' src/; then
            echo "::error::a submit handler above re-parses resolver output, which throws on every transform. Use zodForm and take the values as they arrive."
            exit 1
          fi
          echo "no form re-parses resolver output"

      # Supabase re-emits SIGNED_IN whenever the tab becomes visible, which on a
      # phone is every return from another app. Reloading the profile there put
      # the whole app behind the "Signing you in…" screen, so an open form was
      # unmounted and a half-typed trip was lost — and if that reload failed on
      # a connection that had not woken up yet, an onboarded owner was shown
      # "create your business", one tap away from stranding their records in a
      # second business. Both come back the moment these two lines go.
      - name: Coming back to the app must not reload the profile behind a spinner
        run: |
          set -euo pipefail
          grep -q 'settledFor.current === nextSession.user.id' src/app/AuthProvider.tsx \
            || { echo "::error::AuthProvider reloads the profile on every SIGNED_IN again. Returning from another app now discards whatever is on screen."; exit 1; }
          grep -q 'settledFor.current !== activeSession.user.id' src/app/AuthProvider.tsx \
            || { echo "::error::AuthProvider treats a failed profile read as 'not onboarded' again. A dropped connection now offers to create a second business."; exit 1; }
          echo "an app switch keeps the screen it came back to"

      # The storage policies live in two files — the migration, and a copy to
      # run by hand where the migrating role cannot create them. Two copies of
      # a security rule that can drift is how one quietly becomes wrong.
      - name: The standalone storage policies must match the migration
        run: node scripts/storage-policies.mjs --check

      # The demo is the only way to click through the whole app without a
      # database, so it is worth keeping buildable rather than letting it rot.
      # Runs last: it replaces dist/ with a build that is not production's.
      - name: Build the demo
        run: |
          set -euo pipefail
          npm run build:demo
          test -f dist/demo.html
          grep -q 'balaji-demo-data' dist/assets/*.js \
            || { echo "::error::the demo build carries no demo backend"; exit 1; }
          echo "demo build is intact"

  database:
    name: Migrations and RLS assertions
    runs-on: ubuntu-latest

    # Matches the hosted project's major version, so a behaviour difference
    # shows up here rather than on the first push to production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install the Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply every migration and run the assertions
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-db.sh
